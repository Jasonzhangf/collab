[package]
name = "collab-v2-core"
version = "0.1.0"
edition = "2021"
description = "Collab v2 semantic truth core"

[lib]
name = "collab_v2_core"
path = "crates/core/src/lib.rs"

[[bin]]
name = "core-daemon"
path = "crates/core/src/bin/core-daemon.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
