[package]
name = "collab"
version = "0.2.0"
edition = "2021"
description = "Project-local coordination daemon for multi-agent work: mailbox, claims, App Server transport"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = "0.4"
anyhow = "1"
toml = "0.8"
toml_edit = "0.22"
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
